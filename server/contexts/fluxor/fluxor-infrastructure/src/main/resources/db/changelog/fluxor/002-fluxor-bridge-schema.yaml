databaseChangeLog:
  # Pinned to the path it was first applied under (JAVA-1994): DATABASECHANGELOG keys each
  # changeset on it, so moving the file without this would re-run every changeset.
  - logicalFilePath: db/changelog/heliox/002-fluxor-bridge-schema.yaml
  - changeSet:
      id: 002-fluxor-bridge-schema
      author: javadaba
      context: default
      comment: >
        Extends the heliox context with the Fluxor bridge (plan
        2026-07-09-fluxor-bridge-servidor-y-landing.md, #19, Task 1): device pairing by QR/PIN,
        syncable backlog, flows/runs and their relay. /heliox/v1/* (tickets/releases,
        001-heliox-schema.yaml) stays intact -- these tables are purely additive.

        Documented divergence from the plan's own comment draft: the draft's "account_id text"
        columns become `account_id uuid not null`, the SAME type as
        AccountSession.accountId()/OrganizationId across the rest of the monorepo (see
        forms.owner_account_id, notify/dbaas/social.org_id -- EVERY plan's own comment draft in
        this queue says "text" and every real execution corrects it to uuid; same pattern, not a
        new decision). id/device_id/flow_id/run_id are uuid like the rest of the schema.

        fluxor_task.external_ref has a PARTIAL unique index (account_id, external_ref) where
        external_ref is not null -- the external intake (Task 4, fluxor.task-intake@1) does its
        dedupe by external_ref with a simple insert ... on conflict, no select-then-insert.
      changes:
        - sql:
            sql: |
              create table if not exists fluxor_device (
                id uuid primary key default gen_random_uuid(),
                account_id uuid not null,
                name text not null,
                token_hash text not null unique,
                created_at timestamptz not null default now(),
                last_seen_at timestamptz,
                revoked_at timestamptz
              );
              create index if not exists idx_fluxor_device_account on fluxor_device(account_id);

              create table if not exists fluxor_pairing (
                id uuid primary key default gen_random_uuid(),
                pairing_token_hash text not null unique,
                pin_hash text not null,
                poll_token_hash text not null unique,
                status text not null default 'pending'
                  check (status in ('pending', 'claimed', 'consumed', 'expired')),
                account_id uuid,
                device_id uuid references fluxor_device(id),
                device_name_hint text,
                expires_at timestamptz not null,
                created_at timestamptz not null default now()
              );

              create table if not exists fluxor_task (
                id uuid primary key default gen_random_uuid(),
                account_id uuid not null,
                title text not null,
                body text,
                state text not null default 'backlog',
                priority smallint not null default 3 check (priority between 1 and 5),
                epic_ref text,
                source text not null check (source in ('api', 'console', 'ide')),
                external_ref text,
                version int not null default 1,
                updated_at timestamptz not null default now(),
                updated_by text,
                deleted boolean not null default false
              );
              create index if not exists idx_fluxor_task_account_updated on fluxor_task(account_id, updated_at);
              create unique index if not exists uq_fluxor_task_account_external_ref
                on fluxor_task(account_id, external_ref) where external_ref is not null;

              create table if not exists fluxor_flow (
                id uuid primary key default gen_random_uuid(),
                account_id uuid not null,
                name text not null,
                definition jsonb not null,
                origin text not null check (origin in ('ide', 'console')),
                status text not null check (status in ('draft', 'synced')),
                version int not null default 1,
                updated_at timestamptz not null default now()
              );
              create index if not exists idx_fluxor_flow_account_updated on fluxor_flow(account_id, updated_at);

              create table if not exists fluxor_run (
                id uuid primary key default gen_random_uuid(),
                account_id uuid not null,
                flow_id uuid not null references fluxor_flow(id),
                device_id uuid references fluxor_device(id),
                status text not null check (status in ('running', 'passed', 'failed', 'cancelled')),
                started_at timestamptz not null default now(),
                finished_at timestamptz,
                summary jsonb
              );
              create index if not exists idx_fluxor_run_account_started on fluxor_run(account_id, started_at);

              create table if not exists fluxor_run_event (
                run_id uuid not null references fluxor_run(id),
                seq int not null,
                step_id text,
                type text not null,
                payload jsonb not null,
                at timestamptz not null default now(),
                primary key (run_id, seq)
              );
